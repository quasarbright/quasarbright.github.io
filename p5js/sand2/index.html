<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sand</title>
    <link rel="stylesheet" href="https://quasarbright.github.io/sketches/shared/cohesion.css">
    <script type="module" src="https://quasarbright.github.io/sketches/shared/cohesion.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="sand-app">
        <header class="sand-head">
            <h1 class="sand-title">Sand</h1>
        </header>

        <div class="sand-box">
            <canvas id="board" aria-label="Sand box: drag to paint the selected material"></canvas>
            <div id="brush-ring" hidden></div>
            <div id="hint" class="sand-hint">Drag in the box to pour sand</div>
        </div>

        <div id="picker" class="sand-picker" role="group" aria-label="Material"></div>

        <div class="sand-bar">
            <button id="play" class="sand-btn" aria-label="Pause">
                <svg class="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
                <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" /></svg>
            </button>
            <button id="step" class="sand-btn" title="Step (. or →): advance one turn while paused" aria-label="Step">
                <svg viewBox="0 0 24 24"><path d="M6 5v14l9-7z" /><path d="M18 5v14" /></svg>
            </button>
            <button id="clear" class="sand-btn" title="Clear: empty the box" aria-label="Clear">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" /></svg>
            </button>
            <label class="sand-brush" title="Brush size ([ and ]): how many grains wide one dab is">
                <span class="sand-brush-name">Brush</span>
                <input id="brush" type="range" min="1" max="10" step="1" value="3"
                    title="Brush size ([ and ]): how many grains wide one dab is">
                <span id="brush-value" class="sand-brush-value">3</span>
            </label>
        </div>
    </main>

    <mike-footer></mike-footer>

    <script src="jsonmap.js"></script>
    <script src="grain.js"></script>
    <script src="sketch.js"></script>
</body>

</html>
