# XcodeGen spec. Run `xcodegen` in this folder to create ScheduledTexts.xcodeproj.
name: ScheduledTexts
options:
  bundleIdPrefix: com.quasarbright
  deploymentTarget:
    iOS: "17.0"
packages:
  ScheduledTextsCore:
    path: ScheduledTextsCore
targets:
  ScheduledTexts:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: ScheduledTextsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quasarbright.ScheduledTexts
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scheduled Texts
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
